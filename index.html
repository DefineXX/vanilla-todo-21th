<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ubuntu (Font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
  </head>
  <body>
    <div class="top-level-container">
      <div class="mobile-phone">
        <header class="header">
          <h1 class="header-title">My Tasks</h1>
        </header>

        <label class="add-task-form">
          <input
            type="text"
            class="add-task-input"
            placeholder="Add Your Task!"
          />
          <button class="add-task-button">Add</button>
        </label>

        <section class="task-list-container">
          <h2 class="subtitle">To Do</h2>
          <ul class="task-list"></ul>
        </section>

        <section class="task-list-container">
          <h2 class="subtitle">Done</h2>
          <ul class="task-list"></ul>
        </section>
      </div>
    </div>

    <script src="./src/app.js"></script>
  </body>
</html>
