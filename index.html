<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ubuntu (Font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
  </head>
  <body>
    <div class="top-level-container">
      <div class="mobile-phone">
        <header class="header">
          <h1 class="header-title">My Tasks</h1>
          <button class="calendar-button">
            <img src="icons/calendar.svg" alt="calendar icon" />
            <span class="calendar-text">Calendar</span>
            <input type="date" onfocus="this.type='date'"
            onblur="this.type='text'" id="date-picker" class="date-picker" />
          </button>
        </header>

        <div class="date-task-container">
          <span class="today-date"></span>

          <form class="add-task-form" id="add-task-form">
            <input
              type="text"
              class="add-task-input"
              placeholder="Add Your Task!"
              autofocus
            />
            <button class="add-task-button" type="submit">Add</button>
          </form>
        </div>

        <section class="task-list-container">
          <h2 class="subtitle" id="to-do-list-title"></h2>
          <ul class="task-list" id="to-do-list"></ul>
          <p class="no-tasks" id="no-tasks-to-do"></p>
        </section>

        <section class="task-list-container">
          <h2 class="subtitle" id="done-list-title"></h2>
          <ul class="task-list" id="done-list"></ul>
          <p class="no-tasks" id="no-tasks-done"></p>
        </section>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
